      { "09 · Toolchains, ELF & Makefiles" = "curriculum/tier-3-systems/09-toolchains-elf-makefiles.md" },
      { "10 · UNIX Syscalls & File Descriptors" = "curriculum/tier-3-systems/10-unix-syscalls-file-descriptors.md" },
      { "11 · epoll, kqueue & Zero-Copy mmap" = "curriculum/tier-3-systems/11-io-multiplexing-epoll-kqueue-mmap.md" },
      { "12 · Concurrency, pthreads & Atomics" = "curriculum/tier-3-systems/12-concurrency-pthreads-atomics.md" },
      { "13 · Network Sockets & TLS" = "curriculum/tier-3-systems/13-network-sockets-tls.md" },
    ]},
    { "Tier 4 · Hardware, Forensics & Capstones" = [
