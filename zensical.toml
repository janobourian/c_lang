  { "Language Reference" = [
    "reference/language/index.md",
    { "Basic Concepts & Memory Model" = "reference/language/basic-concepts.md" },
    { "Keywords (C89–C23)" = "reference/language/keywords.md" },
    { "Preprocessor & #embed" = "reference/language/preprocessor.md" },
    { "Expressions, Operators & _Generic" = "reference/language/expressions.md" },
    { "Declarations, Types & typeof" = "reference/language/declarations.md" },
    { "Initialization & Empty {}" = "reference/language/initialization.md" },
    { "Functions & Linkage" = "reference/language/functions.md" },
    { "Statements & Control Flow" = "reference/language/statements.md" },
    { "Attributes (C23)" = "reference/language/attributes.md" },
  ]},
  { "Standard Library" = [
    "reference/library/index.md",
    { "Type Support & Limits" = "reference/library/types.md" },
    { "Program Utilities, Signals & setjmp" = "reference/library/program.md" },
    { "Variadic Functions & Error Handling" = "reference/library/variadic-and-error.md" },
    { "Dynamic Memory Management" = "reference/library/memory.md" },
    { "Byte Strings & Character Utilities" = "reference/library/strings-byte.md" },
    { "Multibyte, Unicode & Wide Strings" = "reference/library/strings-multibyte-wide.md" },
    { "Algorithms (qsort & bsearch)" = "reference/library/algorithms.md" },
    { "Numerics: Math, fenv, Random & Complex" = "reference/library/numerics-math.md" },
    { "Numerics: Bit Manipulation & Checked Int (C23)" = "reference/library/numerics-bit-checked.md" },
    { "Date & Time Utilities (<time.h>)" = "reference/library/chrono.md" },
    { "Input/Output Support (<stdio.h>)" = "reference/library/io.md" },
    { "Localization Support (<locale.h>)" = "reference/library/locale.md" },
    { "Concurrency: Threads & Atomics" = "reference/library/concurrency.md" },
  ]},
  { "C23 & Standards" = [
    "standards/index.md",
    { "C23 Migration & Breaking Changes" = "standards/c23-migration.md" },
    { "Compiler & Libc Support Matrix" = "standards/compiler-support.md" },
    { "Technical Specifications (TS / TR)" = "standards/technical-specifications.md" },
    { "Master Symbol Index & Ecosystem" = "standards/symbol-index.md" },
  ]},
  { "Labs & Operations" = [
    "labs/index.md",
    { "Docs & GitHub Pages Operations" = "labs/docs-operations.md" },
  ]},
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/cpu"
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/janobourian/c_lang"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
