      { "neg02 · Control Flow & Loops" = "curriculum/pre-tier/neg02-control-flow-loops.md" },
      { "neg01 · Functions, Scope & Recursion" = "curriculum/pre-tier/neg01-functions-scope-recursion.md" },
      { "neg00 · Arrays, Strings & Struct Basics" = "curriculum/pre-tier/neg00-arrays-strings-structs.md" },
    ]},
    { "Tier 1 · Core Architecture & Memory" = [
