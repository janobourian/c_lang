      { "02 · Arrays, Pointers & Arithmetic" = "curriculum/tier-1-core/02-arrays-pointers-arithmetic.md" },
      { "03 · Strings & Bounds Safety" = "curriculum/tier-1-core/03-strings-bounds-safety.md" },
      { "04 · Structs, Unions, Bitfields & Enums" = "curriculum/tier-1-core/04-structs-unions-bitfields-enums.md" },
