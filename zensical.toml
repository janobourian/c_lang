      { "06 · Preprocessor, Macros & Headers" = "curriculum/tier-2-runtime/06-preprocessor-macros-headers.md" },
      { "07 · Standard Library Deep Dive" = "curriculum/tier-2-runtime/07-standard-library-deep-dive.md" },
      { "08 · Error Handling, Signals & setjmp" = "curriculum/tier-2-runtime/08-error-handling-signals-setjmp.md" },
    ]},
    { "Tier 3 · Toolchains, OS & Concurrency" = [
