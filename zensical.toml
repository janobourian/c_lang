[project]
site_name = "C Language Mastery & Complete C23 Reference"
site_description = "From Zero to Systems Architect: A complete, modern C89–C23 (ISO/IEC 9899:2024) learning encyclopedia and full en.cppreference.com/c standard reference."
site_author = "janobourian"
site_url = "https://janobourian.github.io/c_lang/"
copyright = "Copyright &copy; 2026 C Language Mastery &amp; C23 Reference"

repo_url = "https://github.com/janobourian/c_lang"
repo_name = "janobourian/c_lang"
edit_uri = "edit/main/docs/"

extra_css = [
  "stylesheets/extra.css",
]

extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

nav = [
